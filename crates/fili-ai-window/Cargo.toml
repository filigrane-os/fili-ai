[package]
name = "fili-ai-window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lia, the window of the assistant of Filigrane: a drawer in Qt Quick on the layer-shell"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
log = "0.4"
fili-ui = { path = "../../../fili-ui-icons" }
env_logger = { version = "0.11", default-features = false }
libc = "0.2.191"
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10.0"
