[workspace]
resolver = "3"
members = ["crates/fili-ai-daemon", "crates/fili-ai-session", "crates/fili-ai-window"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/filigrane-os/fili-ai"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `make dev`: no link-time optimisation, several code generation units and incremental compilation, so that a change of the
# application rebuilds in a fraction of the release time
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
debug = 0
