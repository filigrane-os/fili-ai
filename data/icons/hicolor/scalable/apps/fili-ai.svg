<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"><title>Lia</title>
<!-- Lia, the assistant of Filigrane: the profile of a girl in one thin line, her hair made of filigree (a flower and scrolls). Brand
     colours: nuit tile, a line that goes from voile to brume to sable (the gradient of the line is the only colour). -->
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3644"/><stop offset="1" stop-color="#181d25"/></linearGradient>
  <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="14" y1="88" x2="74" y2="12"><stop offset="0" stop-color="#d2bf92"/><stop offset="0.45" stop-color="#dbe7f4"/><stop offset="1" stop-color="#9dbbd6"/></linearGradient>
  <clipPath id="clip"><rect x="4" y="4" width="88" height="88" rx="20"/></clipPath>
</defs>
<rect x="4" y="4" width="88" height="88" rx="20" fill="url(#tile)"/>
<g clip-path="url(#clip)" fill="none" stroke="url(#line)" stroke-linecap="round" stroke-linejoin="round">
  <!-- hair: the flower -->
  <g stroke-width="1.2">
    <path d="M38 46 C28 40 26 28 36 26 C42 25 44.5 36 38 46 Z"/>
    <path d="M38 46 C44.5 36 54 33 56 40 C57.5 47 46 50 38 46 Z"/>
    <path d="M38 46 C28 47 19.5 54 23.5 60 C28 65.5 38 56 38 46 Z"/>
    <path d="M38 46 C42.5 56 40 68 34 68 C27.5 67.5 30.5 54 38 46 Z"/>
    <path d="M38 46 C47 52 54 62 48.5 66 C42.5 68.5 39.5 56 38 46 Z"/>
  </g>
  <!-- the veins and the pattern of the petals -->
  <g stroke-width="0.8" stroke-opacity="0.85">
    <path d="M38 46 C34 40 33 33 35 29 M38 46 C45 41 50 38 53 40 M38 46 C30 48 25.5 54 25 58 M38 46 C38 54 36.5 61 35 65 M38 46 C43.5 52 47 58 47.5 63"/>
    <path d="M31 33 C32.5 34.5 34.5 34 35 32 M44 38 C45.5 40 47.5 40 48.5 38.5 M27 54 C28.5 55.5 30.5 55 31 53 M34.5 58.5 C36 60 38 59.5 38.5 57.5 M43.5 57 C45 58 46.5 57.5 47 56"/>
  </g>
  <circle cx="38" cy="46" r="2" stroke-width="1"/>
  <path d="M38 46 C39.5 42 40.5 41 41.5 40 M38 46 C41 44 43 44 44.5 44.5" stroke-width="0.8"/>
  <!-- hair: the scrolls -->
  <g stroke-width="1.2">
    <path d="M50 11 C40 8.5 33.5 14.5 35.5 20.5 C37.5 26 45.5 24.5 44.5 19.5 C44 16.5 40.5 16.7 40.7 19"/>
    <path d="M50 11 C57 14.5 60.5 21 58 29"/>
    <path d="M24 63 C13.5 66.5 11.5 80 21.5 84.5 C29.5 87.5 36 80.5 33 75 C31 71 25.5 73 27 77.5"/>
    <path d="M52 29 C54 21.5 59.5 17 66 19 C62 21 60.5 25 62.5 29.5"/>
  </g>
  <g stroke-width="0.8" stroke-opacity="0.85"><path d="M47 14 C43 14.5 40 17 40 20 M55 17 C58 21 58.5 25 57.5 28 M16 70 C15.5 76 18.5 80 22 82 M60 22 C63 21.5 64 23 64 25"/></g>
  <!-- the profile -->
  <g stroke-width="1.5">
    <path d="M61 30 C63.5 34 65 38 65.5 42 C66 44 67.5 46 71 51 C71.5 52 70 53 68.5 53.3 C69.7 54.6 69.5 56 68 56.6 C69 58 68.5 60 66 61.6 C64 63 62 65 60 67"/>
    <path d="M60 67 C60.5 72 60 78 59 88"/>
