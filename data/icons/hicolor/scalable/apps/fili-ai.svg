<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"><title>Lia</title>
<!-- Lia, the assistant of Filigrane, drawn as a manga girl: big bright eyes, shoulder-length hair in locks with a bang, a bow at
     the collar. The colours stay the ones of the brand (nuit tile, voile and ardoise hair, brume skin, a touch of sable and
     cendre); the background is a watermark (filigrane) of thin circles. -->
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3644"/><stop offset="1" stop-color="#181d25"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb0cf"/><stop offset="0.55" stop-color="#5f7894"/><stop offset="1" stop-color="#3d5470"/></linearGradient>
  <linearGradient id="hairLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d0e4"/><stop offset="1" stop-color="#6f8cab"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f1ec"/><stop offset="1" stop-color="#d9e2ee"/></linearGradient>
  <radialGradient id="iris" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#dbe7f4"/><stop offset="0.5" stop-color="#9dbbd6"/><stop offset="1" stop-color="#5f7894"/></radialGradient>
  <clipPath id="tileClip"><rect x="4" y="4" width="88" height="88" rx="20"/></clipPath>
  <clipPath id="eyeL"><path d="M33.3 49 C35 44 43 43.8 46.2 49.8 C45 55.8 37 56.2 33.3 49 Z"/></clipPath>
  <clipPath id="eyeR"><path d="M62.7 49 C61 44 53 43.8 49.8 49.8 C51 55.8 59 56.2 62.7 49 Z"/></clipPath>
</defs>
<rect x="4" y="4" width="88" height="88" rx="20" fill="url(#tile)"/>
<g clip-path="url(#tileClip)">
  <!-- watermark -->
  <g fill="none" stroke="#9dbbd6" stroke-width="0.7" stroke-opacity="0.16">
    <circle cx="48" cy="48" r="32"/><circle cx="48" cy="48" r="40"/><circle cx="48" cy="48" r="48" stroke-dasharray="1.5 2.5"/>
  </g>
  <!-- hair behind -->
  <path d="M48 11.5 C27.5 11.5 18 28 19 46 C20 58 16 69 18.5 83 C26 81 32 78 35 73 L61 73 C64 78 70 81 77.5 83 C80 69 76 58 77 46 C78 28 68.5 11.5 48 11.5 Z" fill="url(#hair)" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <!-- shoulders, collar and bow -->
  <path d="M10 96 C11 84 25 77 38 75 L48 84 L58 75 C71 77 85 84 86 96 Z" fill="#2c3745" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <path d="M38 75 L48 84 L58 75 M34 77 L48 88 L62 77" fill="none" stroke="#dbe7f4" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M48 81.5 L40.5 78 L41.5 85 Z M48 81.5 L55.5 78 L54.5 85 Z" fill="#d2bf92" stroke="#12161d" stroke-width="0.8" stroke-linejoin="round"/>
  <circle cx="48" cy="81.8" r="1.7" fill="#e0d1ab" stroke="#12161d" stroke-width="0.7"/>
  <!-- neck -->
  <path d="M42.5 65 L43 76.5 C45 79 51 79 53 76.5 L53.5 65 Z" fill="#d9e2ee" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <path d="M43 70 C46 72.5 50 72.5 53.3 70" fill="none" stroke="#9dbbd6" stroke-width="0.8" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- face -->
  <path d="M31.5 44 C31 58.5 39.5 70.5 48 71 C56.5 70.5 65 58.5 64.5 44 C64.5 33 57 26 48 26 C39 26 31.5 33 31.5 44 Z" fill="url(#skin)" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <!-- blush -->
  <ellipse cx="36" cy="59" rx="3.6" ry="1.7" fill="#c98f93" fill-opacity="0.4"/>
  <ellipse cx="60" cy="59" rx="3.6" ry="1.7" fill="#c98f93" fill-opacity="0.4"/>
  <!-- eyes -->
  <path d="M33.3 49 C35 44 43 43.8 46.2 49.8 C45 55.8 37 56.2 33.3 49 Z" fill="#f8fafc"/>
  <path d="M62.7 49 C61 44 53 43.8 49.8 49.8 C51 55.8 59 56.2 62.7 49 Z" fill="#f8fafc"/>
  <g clip-path="url(#eyeL)"><circle cx="40" cy="50.2" r="6" fill="url(#iris)"/><circle cx="40" cy="50.4" r="2.1" fill="#1c222b"/></g>
  <g clip-path="url(#eyeR)"><circle cx="56" cy="50.2" r="6" fill="url(#iris)"/><circle cx="56" cy="50.4" r="2.1" fill="#1c222b"/></g>
  <g fill="#ffffff"><circle cx="38.2" cy="48.2" r="1.6"/><circle cx="42.3" cy="52.6" r="0.9"/><circle cx="54.2" cy="48.2" r="1.6"/><circle cx="58.3" cy="52.6" r="0.9"/></g>
  <g fill="none" stroke="#12161d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33 49.4 C35 43.6 43.4 43.4 46.6 50" stroke-width="2.2"/>
    <path d="M63 49.4 C61 43.6 52.6 43.4 49.4 50" stroke-width="2.2"/>
    <path d="M33.1 49 L31.2 47.4 M62.9 49 L64.8 47.4" stroke-width="1.3"/>
    <!-- brows -->
    <path d="M34 42 C37.5 39.8 42 40 45.4 41.6" stroke="#3d5470" stroke-width="1.2"/>
    <path d="M62 42 C58.5 39.8 54 40 50.6 41.6" stroke="#3d5470" stroke-width="1.2"/>
    <!-- nose and mouth -->
    <path d="M48 57 L47.6 58" stroke="#8a6e72" stroke-width="0.9"/>
    <path d="M45.4 62 C47 63.4 49 63.4 50.6 62" stroke="#8a4f58" stroke-width="1"/>
  </g>
  <!-- bang: locks swept to both sides -->
  <path d="M48 11.8 C41.5 15 35 21.5 33.2 32 C32.5 37 33.4 42 35.2 47.5 C36.2 40.5 39.2 34.5 44.2 31.4 C46.8 29.8 47.7 24 48 11.8 Z" fill="url(#hairLight)" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <path d="M48 11.8 C54.5 15 61 21.5 62.8 32 C63.5 37 62.6 42 60.8 47.5 C59.8 40.5 56.8 34.5 51.8 31.4 C49.2 29.8 48.3 24 48 11.8 Z" fill="url(#hairLight)" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <path d="M44.6 15 C44.8 25 46.2 32 48 37 C49.8 32 51.2 25 51.4 15 Z" fill="url(#hairLight)" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <!-- side locks in front of the shoulders -->
  <path d="M34.2 42 C30.5 54 31.5 64 27.5 76 C32 74 35 69 35.6 62 C36 55 35.6 48 34.2 42 Z" fill="url(#hair)" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <path d="M61.8 42 C65.5 54 64.5 64 68.5 76 C64 74 61 69 60.4 62 C60 55 60.4 48 61.8 42 Z" fill="url(#hair)" stroke="#12161d" stroke-width="1" stroke-linejoin="round"/>
  <!-- shine and strands -->
  <g fill="none" stroke-linecap="round">
    <path d="M28.5 27 C34 18.5 43 14.5 52 15" stroke="#dbe7f4" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M62 17.5 C66 20 69 24 70.5 29" stroke="#dbe7f4" stroke-opacity="0.45" stroke-width="1"/>
    <path d="M40 18 C37.5 24 36.5 29 36.2 34 M56 18 C58.5 24 59.5 29 59.8 34" stroke="#12161d" stroke-opacity="0.45" stroke-width="0.7"/>
    <path d="M23.5 40 C22 52 25 62 21.5 76 M72.5 40 C74 52 71 62 74.5 76" stroke="#12161d" stroke-opacity="0.4" stroke-width="0.8"/>
    <path d="M24.5 36 C23.5 44 25 50 23.8 58 M71.5 36 C72.5 44 71 50 72.2 58" stroke="#dbe7f4" stroke-opacity="0.35" stroke-width="0.9"/>
    <path d="M30.5 52 C30 60 31.5 66 29.5 72 M65.5 52 C66 60 64.5 66 66.5 72" stroke="#dbe7f4" stroke-opacity="0.4" stroke-width="0.8"/>
  </g>
  <!-- hair clip -->
  <path d="M64.5 25.5 L70 22.8 M64 28.5 L69.5 26" fill="none" stroke="#d2bf92" stroke-width="1.7" stroke-linecap="round"/>
</g>
</svg>
