[workspace]
resolver = "3"
members = ["crates/fili-ai-daemon", "crates/fili-ai-session", "crates/fili-ai-window"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/filigrane-os/fili-ai"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
